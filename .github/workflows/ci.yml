name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the NoM reference source
        uses: actions/checkout@v4
        with:
          repository: zenon-network/go-zenon
          ref: e4513e2a8afafa5658da327eeb28a6bf8a6abce4
          persist-credentials: false
          path: .nom-reference

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .nom-reference/go.sum

      - name: Build the NoM genesis verifier
        working-directory: .nom-reference
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
          CGO_ENABLED: "1"
        run: |
          test "$(git rev-parse HEAD)" = e4513e2a8afafa5658da327eeb28a6bf8a6abce4
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/zvm-nom-genesis" "$GITHUB_WORKSPACE/tools/nom-genesis/main.go"
          sha256sum "$RUNNER_TEMP/zvm-nom-genesis"

      - run: go build ./...
      - run: go vet ./...
      - name: Generate the chain-69 Devnet genesis fixture
        run: |
          timestamp=$(jq -er '.l2GenesisTimestamp' chains/l2-69/rollup.json)
          go run -mod=readonly ./cmd/zvm l1-genesis \
            -out "$RUNNER_TEMP/zvm-l1-devnet" -devnet .nom-reference/docker/devnet \
            -chain-id 69 -dynamic-plasma=true -timestamp "$timestamp"
          sha256sum "$RUNNER_TEMP/zvm-l1-devnet/genesis.json"
      - run: go test -json -count=1 ./...
        env:
          ZVM_TEST_NOM_GENESIS_VERIFIER: ${{ runner.temp }}/zvm-nom-genesis
          ZVM_TEST_NOM_DEVNET_GENESIS: ${{ runner.temp }}/zvm-l1-devnet/genesis.json
