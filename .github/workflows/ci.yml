name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - name: Run artifact and source race tests
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOTELEMETRY: "off"
          GOAUTH: "off"
          GOFLAGS: ""
          GOPROXY: "off"
          GOSUMDB: "off"
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          GOMAXPROCS: "2"
        run: >-
          go test -race -vet=off -p=1 -mod=readonly -parallel=1
          -count=1 -timeout=90s -json
          ./release/artifacts ./cmd/zvm-artifact-check ./cmd/zvm-sbom
          ./cmd/zvm-artifact-pack ./cmd/zvm-source-check
